name: 每日股價更新

on:
  schedule:
    # 三個錯開的鬧鐘，週一至週五（UTC）。GitHub 排程器在尖峰時會丟事件，
    # 尤其整點（:00）最容易被丟——故意用零散分鐘、彼此隔約 50 分鐘：
    # 任一個成功當天就補上；三個一起被丟才會漏（機率極低）。
    # 腳本冪等（同日重跑覆蓋成同值），多跑無害。
    - cron: '35 6 * * 1-5'   # 台北 14:35（主要，收盤後約 1 小時）
    - cron: '25 7 * * 1-5'   # 台北 15:25（備援一）
    - cron: '10 8 * * 1-5'   # 台北 16:10（備援二）
  workflow_dispatch:  # 允許手動觸發

# 三個鬧鐘幾乎不會重疊（各約 1 分鐘、間隔約 50 分鐘），
# 但萬一前一次卡住，讓後一次排隊等待而非同時寫入，避免互踩。
concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas

      - name: 執行每日股價更新
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/daily_price_update.py

      - name: 排程失敗 Email 通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: qwert0708@hotmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [台股估值] 每日股價更新失敗"
          to: qwert0708@hotmail.com
          from: qwert0708@hotmail.com
          body: |
            每日股價更新排程執行失敗，請至以下連結查看錯誤日誌：

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
