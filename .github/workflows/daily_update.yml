name: 每日股價更新

on:
  schedule:
    # 三個錯開的鬧鐘，週一至週五（UTC）。
    #
    # 為什麼名目時間排在盤中（台北 13:00 起）：GitHub 對私有 repo 的排程
    # 一律延後執行——實測延遲 2h01m～4h58m（中位 3h21m），從未準時、
    # 也從未被丟掉。故意提前約 2.5 小時，讓「排定時間＋實際延遲」落在
    # 收盤（13:30）後不久：最快 15:01、中位 16:21、最慢 17:58 落地。
    #
    # 為什麼從台北 12:00 挪後 1 小時（2026-07-29）：TWSE 除權息還原因子端點
    # TWT49U 在台北 14:30 前的早時段常回空回應（非 JSON），第一步就 exit 1。
    # 實測 7/24、7/28、7/29 最早落地的鬧鐘（台北約 14:2x）連續三天因此失敗，
    # 稍晚落地的鬧鐘則正常。把最早落地推到台北 15:00 後，避開端點未就緒的時段。
    #
    # 提前排程之所以安全，靠的是腳本不用系統時間當資料日期：
    # 萬一 GitHub 破天荒準時、在盤中就跑起來，來源端點會回「無符合資料」，
    # 腳本判定為休市後 exit 0 不寫入（見 daily_price_update.py），屬無害空轉。
    #
    # 錯開約 45 分鐘則是冗餘：腳本冪等（同日重跑覆蓋成同值），多跑無害。
    - cron: '0 5 * * 1-5'    # 台北 13:00 排定 → 約 15:01-17:58 落地（主要）
    - cron: '45 5 * * 1-5'   # 台北 13:45 排定（備援一）
    - cron: '30 6 * * 1-5'   # 台北 14:30 排定（備援二）
  workflow_dispatch:  # 允許手動觸發

# 三個鬧鐘幾乎不會重疊（各約 1 分鐘、間隔約 50 分鐘），
# 但萬一前一次卡住，讓後一次排隊等待而非同時寫入，避免互踩。
concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas

      # 除權息還原因子：存交易所公告的「參考價 ÷ 前收盤價」，供還原歷史價使用。
      # 必須每日跑——上櫃端點只有當日資料，漏一天就永久缺那天的官方因子
      # （上市可事後用區間查詢補回，上櫃不行）。缺的日期會回退自算公式，
      # 那條公式涵蓋不了現金增資與減資。
      # 放在股價更新之前：先有還原因子，當日估值才是用正確的歷史倍數算的。
      - name: 更新除權息還原因子
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/download_ex_right_factors.py

      - name: 執行每日股價更新
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/daily_price_update.py

      - name: 排程失敗 Email 通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: qwert0708@hotmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [台股估值] 每日股價更新失敗"
          to: qwert0708@hotmail.com
          from: qwert0708@hotmail.com
          body: |
            每日股價更新排程執行失敗，請至以下連結查看錯誤日誌：

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
