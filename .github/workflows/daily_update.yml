name: 每日股價更新

on:
  schedule:
    # 台灣時間週一至週五 14:30（UTC 06:30），收盤後約 1 小時
    - cron: '30 6 * * 1-5'
  workflow_dispatch:  # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas

      - name: 執行每日股價更新
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/daily_price_update.py

      - name: 排程失敗 Email 通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: qwert0708@hotmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [台股估值] 每日股價更新失敗"
          to: qwert0708@hotmail.com
          from: qwert0708@hotmail.com
          body: |
            每日股價更新排程執行失敗，請至以下連結查看錯誤日誌：

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
