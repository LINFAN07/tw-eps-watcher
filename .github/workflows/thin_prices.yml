name: 股價週採樣瘦身

on:
  schedule:
    # 台灣時間每月 21 日 04:00（UTC 20 日 20:00）。
    # 刻意避開每月 1 日（新股發現）與 11 日（月營收），也避開每日收盤更新時段。
    #
    # 為什麼要定期跑：瘦身保留「近 3 個月每日」，這個窗口會隨時間往前滾動，
    # 每個月會多出約一個月份的每日資料需要降為週採樣。不定期執行，
    # 容量就會以每年約 50MB 的速度重新長回來。
    - cron: '0 20 20 * *'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: read
  issues: write

jobs:
  thin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install supabase python-dotenv

      # 需資料庫已存在 thin_daily_prices() 函式（sql/thin_daily_prices.sql）。
      # 刪除後不執行 VACUUM：PostgREST 無法執行 VACUUM，且每月刪除量約 5 萬列，
      # autovacuum 會自動回收為可重用空間。切勿改成 VACUUM FULL——
      # 它需要約 252MB 暫存空間，在容量吃緊時必定失敗（見 sql/thin_daily_prices.sql）。
      - name: 週採樣瘦身
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/thin_daily_prices.py

      # 失敗通知改開 GitHub issue：Outlook 已停用 SMTP 基本驗證，
      # 原本的寄信自 2026-07 起每次都是 535 認證失敗，等於無聲
      - name: 失敗通知
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow-name: 股價週採樣瘦身
