name: 財報季基本面更新

on:
  schedule:
    # 每個財報季申報截止後執行一次（資產負債表與現金流量表一季才變動一次，
    # 且兩者皆需 FinMind 逐股呼叫各約 4.2 小時，跑太多次會超出
    # 私有 repo 每月 2,000 分鐘的免費額度）。
    - cron: '0 8 18 5 *'    # Q1（截止 5/15）
    - cron: '0 8 17 8 *'    # Q2（截止 8/14）
    - cron: '0 8 17 11 *'   # Q3（截止 11/14）
    - cron: '0 8 3 4 *'     # Q4／年報（截止 3/31）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # 每股淨值與負債比
  #
  # 刻意使用 FinMind 而非 TWSE OpenAPI 的「每股參考淨值」：
  # OpenAPI 只提供最新一季，無歷史資料，而 P/B 百分位帶需要至少 8 季；
  # 且兩者對「特別股」的處理不同（官方以總股本計算、FinMind 僅普通股），
  # 混用會讓同一支股票的歷史序列與最新值基準不一致，使百分位帶失真。
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv

      - name: 下載資產負債表（FinMind）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/download_balance_sheet.py

  # 現金流量表：無整批 OpenAPI 端點，只能逐股呼叫 FinMind（約 4.2 小時）
  # 因此一季只跑 2 次，不像淨值那樣可以頻繁更新
  cash_flows:
    needs: balance
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv

      - name: 下載現金流量表（FinMind）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/download_cash_flows.py

  # 損益表：營業利益率（operating_margin）的 TTM 分子來源，逐股呼叫 FinMind（約 4.2 小時）
  # 刻意沿用 FinMind 而非交易所綜合損益表 OpenAPI：OpenAPI 是「年度累計」且僅最新一季、無歷史，
  # 與 income_statement_quarterly 既有的單季歷史序列基準不一致，混用會讓 TTM 加總失真。
  # 三個 FinMind 工作（淨值／現金流／損益表）必須串接而非並行，否則同一 token 會撞速率限制。
  income:
    needs: cash_flows
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv

      - name: 下載損益表（FinMind）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/download_income_statement.py

  # 基準值更新後必須重算，否則網站仍顯示舊估值
  recalculate:
    needs: income
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas numpy

      - name: 重算替代估值（P/B / P/S / P/FCF / 殖利率）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/calculate_alt_valuations.py

      # 營業利益率：分母借用上一步剛寫入的 valuations.ps_revenue_per_share，順序不可顛倒
      - name: 重算營業利益率（TTM operating_margin）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/calculate_quality_metrics.py

      # 負債比：把 balance_sheet_quarterly 最新一季搬進 valuations.debt_ratio 供前端顯示
      - name: 回填負債比（valuations.debt_ratio）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/patch_debt_ratio.py

      # 股本變動偵測：讀 balance_sheet_quarterly 逐季股本，標記減資/增資影響河流圖的股票
      - name: 偵測股本變動（valuations.capital_change_warning）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/patch_capital_change_warning.py

      # 業外收支偵測：讀 income_statement_quarterly，比對營業利益 vs 稅後淨利，
      # 標記獲利主要來自業外（賣祖產）的公司。排行榜會依此欄排除股票。
      # 2026-07-21 補掛：此腳本先前不在任何 workflow，nonop_warning 自一次性回填後
      # 就再也沒更新，新出現的業外虛胖不會被標記、已改善的也不會解除。
      - name: 偵測業外收支（valuations.nonop_warning）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/patch_nonop_warning.py

      # 失敗通知改開 GitHub issue：Outlook 已停用 SMTP 基本驗證，
      # 原本的寄信自 2026-07 起每次都是 535 認證失敗，等於無聲
      - name: 失敗通知
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow-name: 財報季基本面更新
