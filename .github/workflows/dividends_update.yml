name: 股利更新

on:
  schedule:
    # 台股除息集中在 7～9 月；股利每年僅公告一次，不需頻繁更新。
    # 逐股呼叫 FinMind 約需 4.2 小時，故一年只跑 2 次
    # （7 月中：多數公司已除息；9 月中：補收晚除息者）。
    - cron: '0 8 15 7 *'
    - cron: '0 8 15 9 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv

      - name: 下載現金股利（FinMind）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/download_dividends.py

  # 股利是殖利率估值帶的基準值，更新後需重算
  recalculate:
    needs: download
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas numpy

      # 除權息還原改為即時計算（不儲存）：股利改變 → 兩個重算會即時用新股利還原歷史帶。
      # 因還原價現在也影響 P/E，故股利更新亦須重算 P/E（過去只重算替代模型，是漏洞）。
      - name: 重算 P/E 估值（即時還原吃新股利）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/calculate_valuation.py

      - name: 重算替代估值（含殖利率估值帶）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/calculate_alt_valuations.py

      # 失敗通知改開 GitHub issue：Outlook 已停用 SMTP 基本驗證，
      # 原本的寄信自 2026-07 起每次都是 535 認證失敗，等於無聲
      - name: 失敗通知
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          workflow-name: 股利更新
