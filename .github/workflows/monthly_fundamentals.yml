name: 月營收更新

on:
  schedule:
    # 台灣時間每月 11 日 15:00（UTC 07:00）
    # 上市櫃公司月營收依法須於次月 10 日前公告，11 日抓可確保資料齊全
    - cron: '0 7 11 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # OpenAPI 整批端點，實測數十秒即可完成

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv

      - name: 更新月營收（TWSE/TPEx OpenAPI）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/update_fundamentals.py --revenue

  # 月營收是 P/S 的基準值，更新後需重算才會反映到網站
  recalculate:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas numpy

      - name: 重算替代估值（P/B / P/S / P/FCF / 殖利率）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/calculate_alt_valuations.py

      - name: 排程失敗 Email 通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: qwert0708@hotmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [台股估值] 月營收更新失敗"
          to: qwert0708@hotmail.com
          from: qwert0708@hotmail.com
          body: |
            月營收更新排程執行失敗，請至以下連結查看錯誤日誌：

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
