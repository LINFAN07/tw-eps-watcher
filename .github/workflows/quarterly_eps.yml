name: 季度 EPS 更新

on:
  schedule:
    # 財報季期間「每週一」執行（原本設為每個工作日，
    # 但每次全市場掃描約 4.2 小時，私有 repo 每月僅 2,000 分鐘免費額度，
    # 每日跑光八月就需 5,670 分鐘。腳本已會跳過已取得本季 EPS 的股票，
    # 因此每週一次即可在季末前收齊，且執行時間逐次遞減）。
    #
    # Q1（3月底結帳，5/1~5/15 申報）
    - cron: '0 7 * 5 1'
    # Q2（6月底結帳，8/1~8/14 申報）
    - cron: '0 7 * 8 1'
    # Q3（9月底結帳，10/1~11/14 申報）
    - cron: '0 7 * 10 1'
    - cron: '0 7 1-14 11 1'
    # Q4/年報（12月底結帳，隔年1/1~3/31 申報）
    - cron: '0 7 * 1-3 1'
  workflow_dispatch:  # 允許手動觸發
    inputs:
      time_budget:
        description: '抓取時間預算（分鐘）。填小值可快速驗證接力結構是否正常'
        required: false
        default: '320'

# ── 為什麼要拆成兩個接力 job（2026-08-10 事故）
#
# GitHub Actions 單一 job 上限 6 小時，時間到會【立即砍掉】整個 job。
# 2026-08-10 抓到 2360/2436 支時被砍，那些 EPS 已寫入 eps_quarterly，
# 但排在抓取迴圈之後的 cv.run() 一步都沒執行 → 兩張表不一致，
# 而畫面上看不出來（89 支的估值停在舊財報，方向是目標價偏低）。
# 更糟的是 cancelled 不觸發 `if: failure()`，連通知都沒有。
#
# 對策有二，缺一不可：
#   1. 腳本用 --time-budget 主動收尾（預算只管抓取，重算一定會跑完）
#   2. 剩餘的交給接力 job，靠腳本既有的「已有本季資料就跳過」自動接續
# 額度不會因此變多：工作量相同，只是繞開單一 job 的 6 小時牆；
# 且 remaining=0 時第二個 job 根本不啟動（財報季後段幾乎都是這種情形）。

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # 比 --time-budget 多 30 分鐘，留給重算與收尾
    outputs:
      remaining: ${{ steps.eps.outputs.remaining }}
      last_id:   ${{ steps.eps.outputs.last_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas

      - name: 執行季度 EPS 更新（第一段）
        id: eps
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        # quarterly_eps_update.py 會 import calculate_valuation，需在 scripts/ 內執行
        working-directory: scripts
        run: python quarterly_eps_update.py --time-budget ${{ inputs.time_budget || '320' }}

      # 金控/保險/證券期貨業的 EPS 在 FinMind 更新較慢，每年 Q1 常缺（2026-07 曾 13 家金控全缺）。
      # 用交易所綜合損益表 OpenAPI 補上官方基本每股盈餘。只在 Q1 財報季（5 月那條 cron）或手動觸發時跑，
      # 因綜合損益表僅 Q1 累計＝單季可安全採用（Q2~Q4 無法還原單季，仍靠上一步的 FinMind）。
      - name: 補金控/保險 Q1 EPS（交易所損益表）
        if: github.event.schedule == '0 7 * 5 1' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        working-directory: scripts
        run: python backfill_eps_from_income.py

  # 第一段沒抓完才啟動。`always()` 是必要的：第一段若被 timeout 砍掉，
  # outputs 是空字串（不等於 '0'），此時更需要接力把剩下的抓完。
  update-continue:
    needs: update
    if: always() && needs.update.outputs.remaining != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas

      # --after 從第一段的斷點續跑。第一段若被 timeout 砍，last_id 是空字串，
      # 腳本會退化成從頭掃（重複但不會漏）——這是安全的一邊。
      - name: 執行季度 EPS 更新（接力）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        working-directory: scripts
        run: >-
          python quarterly_eps_update.py
          --time-budget ${{ inputs.time_budget || '320' }}
          --after "${{ needs.update.outputs.last_id }}"

  # 逐一檢查 needs 的 result，不可用 `failure() || cancelled()`：
  # job 被 timeout-minutes 砍掉時 result 是 'cancelled'，而 failure() 只認 'failure'；
  # cancelled() 問的又是「整個 workflow 被取消」而非單一 job。兩個內建函式都漏掉
  # 這個情形，正是 2026-08-10 超時完全無聲的原因。
  # update-continue 沒啟動時 result 是 'skipped'（正常情形），不該觸發通知。
  notify:
    needs: [update, update-continue]
    if: >-
      always() && (
        needs.update.result == 'failure' || needs.update.result == 'cancelled' ||
        needs.update-continue.result == 'failure' || needs.update-continue.result == 'cancelled'
      )
    runs-on: ubuntu-latest
    steps:
      - name: 排程失敗 Email 通知
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: qwert0708@hotmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [台股估值] 季度 EPS 更新失敗或超時"
          to: qwert0708@hotmail.com
          from: qwert0708@hotmail.com
          body: |
            季度 EPS 更新排程失敗或超時，請至以下連結查看錯誤日誌：

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
