name: 季度 EPS 更新

on:
  schedule:
    # 財報季期間「每週一」執行（原本設為每個工作日，
    # 但每次全市場掃描約 4.2 小時，私有 repo 每月僅 2,000 分鐘免費額度，
    # 每日跑光八月就需 5,670 分鐘。腳本已會跳過已取得本季 EPS 的股票，
    # 因此每週一次即可在季末前收齊，且執行時間逐次遞減）。
    #
    # Q1（3月底結帳，5/1~5/15 申報）
    - cron: '0 7 * 5 1'
    # Q2（6月底結帳，8/1~8/14 申報）
    - cron: '0 7 * 8 1'
    # Q3（9月底結帳，10/1~11/14 申報）
    - cron: '0 7 * 10 1'
    - cron: '0 7 1-14 11 1'
    # Q4/年報（12月底結帳，隔年1/1~3/31 申報）
    - cron: '0 7 * 1-3 1'
  workflow_dispatch:  # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # EPS 下載最多 6 小時（2524 支 × 6.5 秒）

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pandas

      - name: 執行季度 EPS 更新
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        # quarterly_eps_update.py 會 import calculate_valuation，需在 scripts/ 內執行
        working-directory: scripts
        run: python quarterly_eps_update.py

      - name: 排程失敗 Email 通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: qwert0708@hotmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [台股估值] 季度 EPS 更新失敗"
          to: qwert0708@hotmail.com
          from: qwert0708@hotmail.com
          body: |
            季度 EPS 更新排程執行失敗，請至以下連結查看錯誤日誌：

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
