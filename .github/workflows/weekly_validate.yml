name: 每週估值一致性驗證

on:
  schedule:
    # 台灣時間每週一早上 09:00（UTC 01:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:  # 允許手動觸發

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安裝套件
        run: pip install requests supabase python-dotenv pyyaml

      # 排程稽核：比對「scripts/ 下所有腳本」與「workflow 實際執行的腳本」，
      # 抓出寫好卻沒掛排程的工作。此類缺陷不報錯、無症狀，只會讓某個資料欄位
      # 悄悄停在最後一次手動執行的值——專案已踩過兩次（品質指標重算、業外收支偵測）。
      # 不需要資料庫，純靜態檢查，故放在估值驗證之前先跑。
      - name: 排程稽核（確認每支腳本都真的會被執行）
        run: python scripts/audit_workflows.py

      - name: 執行估值驗證（內部一致性 + 與 FinMind 跨來源比對）
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          # 跨來源比對用；未設定時腳本會跳過該段並印出警告，
          # 但只驗內部一致性抓不到日期位移與陳舊資料
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/validate_valuations.py

      - name: 驗證失敗 Email 通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: qwert0708@hotmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [台股估值] 每週估值一致性驗證失敗"
          to: qwert0708@hotmail.com
          from: qwert0708@hotmail.com
          body: |
            每週估值一致性驗證發現嚴重問題，請至以下連結查看錯誤日誌：

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
