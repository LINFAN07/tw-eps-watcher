name: 每週估值一致性驗證

on:
  schedule:
    # 台灣時間每週一早上 09:00（UTC 01:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:  # 允許手動觸發

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # pandas / numpy 是 refetch_restated_eps.py 帶進來的——它會 import
      # calculate_valuation 重算有更正的股票
      - name: 安裝套件
        run: pip install requests supabase python-dotenv pyyaml pandas numpy

      # 排程稽核：比對「scripts/ 下所有腳本」與「workflow 實際執行的腳本」，
      # 抓出寫好卻沒掛排程的工作。此類缺陷不報錯、無症狀，只會讓某個資料欄位
      # 悄悄停在最後一次手動執行的值——專案已踩過兩次（品質指標重算、業外收支偵測）。
      # 不需要資料庫，純靜態檢查，故放在估值驗證之前先跑。
      # 平行實作的一致性測試。back_adjust / report_window 各有 Python 與
      # TypeScript 兩份，兩邊讀同一份 fixture（tests/fixtures/shared_cases.json）。
      # 2026-07-22 一天之內漂移三次，靠註解寫「兩邊必須同步修改」擋不住。
      # 純函式、不連資料庫，數秒完成，故放在最前面先擋。
      - name: 平行實作一致性測試（Python 端）
        run: python tests/test_shared.py

      # 更正申報的分類邏輯（更正／來源分歧／新季度三者處置不同，判錯不會報錯）。
      # 純函式、不連資料庫，故與上一支放在一起先擋。
      - name: 更正申報分類邏輯測試
        run: python tests/test_restated_eps.py

      - name: 設定 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 平行實作一致性測試（TypeScript 端）
        working-directory: frontend
        run: npx --yes tsx ../tests/test_shared.ts

      - name: 排程稽核（確認每支腳本都真的會被執行）
        run: python scripts/audit_workflows.py

      # 交叉驗證：同一個數字用兩條路徑重算比對，抓單位錯、累計誤用、基準不符。
      # 內部一致性檢查抓不到這類錯誤——那些數字彼此自洽，規則全部會通過。
      - name: 交叉驗證健檢（衍生值 vs 原始資料重算）
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/audit_cross_check.py

      # 更正申報回補：eps_quarterly 是唯一「寫入後就不再重抓」的財報表
      # （quarterly_eps_update.py 會跳過已有本季資料的股票以省下 4.2 小時），
      # 公司事後更正財報，數字就永久停在第一版。2026-07-27：1591 的 2026Q1
      # 停在 -0.08，官方已更正為 -1.18。
      #
      # ⚠️ 必須排在 audit_external.py【之前】：那支發現不符會 exit 1，
      # 而步驟失敗會中止整個 job——排在後面等於永遠不會執行。
      # 順序也讓稽核看到的是修完之後的狀態，剩下的才是真的需要人看的。
      - name: 更正申報回補（重抓與交易所對不上的 EPS）
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/refetch_restated_eps.py

      # 對外比對：拿交易所官方申報值驗 EPS、每股淨值、除權息還原。
      # 上面兩支都只看「我們自己的數字彼此合不合」，來源本身錯了照樣通過；
      # 本專案四次事故有三次正是這一類，且都是靠人工跨來源比對才發現的。
      # 2026-07-22 首跑即抓出面額寫死造成 23% 的每股淨值錯誤（4763 目標價高估 22 倍）。
      - name: 對外比對稽核（交易所官方申報值）
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/audit_external.py

      - name: 執行估值驗證（內部一致性 + 與 FinMind 跨來源比對）
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
          # 跨來源比對用；未設定時腳本會跳過該段並印出警告，
          # 但只驗內部一致性抓不到日期位移與陳舊資料
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/validate_valuations.py

      # 未還原的資本事件普查（減資／分割／換發不走除權除息公告，兩條還原路徑都接不到）。
      # 上一支的 C 段只掃近 30 天——2016~2025 的股價是週採樣，10% 漲跌幅門檻在
      # 週區間失去意義，歷史存量抓不到。本支改用「股本變動 × 價格反比跳動」交叉確認，
      # 不受採樣頻率影響。結果寫入 unadjusted_capital_events，前端據此排除排行榜。
      # 耗時約 5 分鐘（要載入候選股全歷史價格），故排在所有檢查之後。
      - name: 未還原資本事件普查
        env:
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python scripts/audit_capital_events.py

      - name: 驗證失敗 Email 通知
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp-mail.outlook.com
          server_port: 587
          username: qwert0708@hotmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ [台股估值] 每週估值一致性驗證失敗"
          to: qwert0708@hotmail.com
          from: qwert0708@hotmail.com
          body: |
            每週估值一致性驗證發現嚴重問題，請至以下連結查看錯誤日誌：

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
